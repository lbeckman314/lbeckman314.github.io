name: Build + Deploy
on:
  push:
    branches:
    - main  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Builds the TinaCMS admin into public/admin so Astro ships it at
      # /admin/. Skipped until the TINA_CLIENT_ID and TINA_TOKEN repository
      # secrets exist (from app.tina.io), so deploys keep working without it.
      - name: Build TinaCMS admin
        if: env.TINA_CLIENT_ID != ''
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: npx tinacms build --noTelemetry

      - name: Build with Astro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
            COMMIT=$(git rev-parse --short HEAD) npx astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Add Pagefind
        run: |
            npx pagefind --site dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
