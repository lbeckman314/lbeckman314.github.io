# Sveltia CMS - https://sveltiacms.app/en/docs/
# Admin UI: /admin/ on the live site, or http://localhost:4321/admin/index.html
# with `npm run dev` ("Work with Local Repository" edits files on disk).

backend:
  name: github
  repo: lbeckman314/lbeckman314.github.io
  branch: main
  # Swap for GitLab/Codeberg later without touching the collections below:
  # name: gitlab | gitea

# Uploads from the image button land here and are written into posts as
# /assets/images/<file>.
media_folder: /public/assets/images
public_folder: /assets/images
media_libraries:
  default:
    config:
      # "My Run Photo.jpg" -> "my-run-photo.webp"
      slugify_filename: true
      # Shrink phone photos (incl. iPhone HEIC) before they're committed.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

# Don't write `updated: ''` etc. for blank optional fields - Astro's content
# schema would reject an empty date.
output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: src/content/notes
    extension: md
    format: frontmatter
    create: true
    # Show notes in subfolders (e.g. running-around-portland/) as a tree.
    nested:
      depth: 3
      subfolders: false
    sortable_fields: [date, title]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
      - { name: description, label: Description, widget: text, required: false }
      - { name: updated, label: Updated, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, required: false }
      - { name: series, label: Series, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false }
      - { name: archive, label: Archive, widget: boolean, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: socials, label: Socials, widget: list, required: false }
      - name: body
        label: Content
        widget: richtext
        editor_components: [image, code-block, strava]

  # MDX notes import Astro components, which the visual editor can't
  # represent, so they're edited as raw text only.
  - name: notes_mdx
    label: Notes (MDX)
    label_singular: MDX note
    folder: src/content/notes
    extension: mdx
    format: frontmatter
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
      - { name: description, label: Description, widget: text, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false }
      - { name: body, label: Content, widget: richtext, modes: [raw] }

  - name: site
    label: Projects
    files:
      - name: projects
        label: Projects
        file: src/content/projects.yaml
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            root: true
            summary: "{{title}}"
            fields:
              - { name: id, label: "ID (also its /projects/<id> URL)", widget: string }
              - { name: title, label: Title, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
              - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, required: false }
              - { name: updated, label: Updated, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, required: false }
              - { name: draft, label: Draft, widget: boolean, required: false }
              - { name: archive, label: Archive, widget: boolean, required: false }
              - { name: tags, label: Tags, widget: list, required: false }
              - { name: socials, label: Socials, widget: list, required: false }
              - { name: demo, label: Demo URL, widget: string, required: false }
              - { name: repo, label: Repository URL, widget: string }
              - { name: packageURL, label: Package URL, widget: string, required: false }
              - { name: pro, label: Professional, widget: boolean, required: false }
              - { name: languages, label: Languages, widget: list, required: false }
