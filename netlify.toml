[build]
  # Netlify's dependency cache can carry over a stale node_modules/.vite (and
  # .astro) dep-optimization cache from a previous Astro major version, which
  # has caused prerender-time "Named export ... not found" failures for
  # transitive deps (clsx, cookie) after the Astro 5 -> 7 upgrade. Clearing
  # both before installing/building avoids reusing that stale cache.
  command = "rm -rf node_modules/.vite node_modules/.astro dist && pnpm run build"

[build.environment]
  NODE_VERSION = "26"


# Short link to the latest resume PDF published by
# https://github.com/lbeckman314/resume's release workflow. 302 rather than
# 301 so browsers don't cache it if the asset name ever changes.
[[redirects]]
  from = "/resume"
  to = "https://github.com/lbeckman314/resume/releases/latest/download/resume-liam-beckman.pdf"
  status = 302
