media:
  input: public/assets
  output: /assets/

content:
  - name: notes
    label: Notes/Blog Posts
    type: collection
    path: src/content/notes
    view:
      fields:
        - title
        - date
        - tags
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Note Content
        type: code
        options:
          language: markdown
