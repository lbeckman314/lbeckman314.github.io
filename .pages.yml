media:
  input: public/assets
  output: /assets/

content:
  - name: notes
    label: Notes/Blog Posts
    type: collection
    path: src/content/notes
    view:
      fields:
        - title
        - date
        - tags
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Description
        type: text
      - name: updated
        label: Updated
        type: date
      - name: draft
        label: Draft
        type: boolean
      - name: archive
        label: Archive
        type: boolean
      - name: tags
        label: Tags
        type: string
        list: true
      - name: socials
        label: Socials
        type: string
        list: true
      - name: body
        label: Note Content
        type: code
        options:
          language: markdown

  - name: projects
    label: Projects
    type: file
    path: src/content/projects.yaml
    format: yaml
    list: true
    fields:
      - name: id
        label: ID (also its /projects/<id> URL)
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: date
        label: Date
        type: date
      - name: updated
        label: Updated
        type: date
      - name: draft
        label: Draft
        type: boolean
      - name: archive
        label: Archive
        type: boolean
      - name: tags
        label: Tags
        type: string
        list: true
      - name: socials
        label: Socials
        type: string
        list: true
      - name: demoURL
        label: Demo URL
        type: string
      - name: repoURL
        label: Repository URL
        type: string
        required: true
      - name: packageURL
        label: Package URL
        type: string
      - name: pro
        label: Professional
        type: boolean
      - name: languages
        label: Languages
        type: string
        list: true
