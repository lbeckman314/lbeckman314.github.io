- id: conrad-2014
  title: "Mount Hood: Adventures of the Wy'east Climbers, 1930–1942"
  author: Ric Conrad
  publisher: Kahuna Books
  year: 2014
  kind: book
  note: >-
    The principal history of the club, built on oral histories with surviving
    members, the Wy'east Bulletins, Mazama Annuals and archives, period newspapers
    and summit registers. Most entries on this site should eventually be checked
    against it page-by-page.

